<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Know Weather - FarmSmart</title>
  <link rel="stylesheet" href="STYLE1.css" />
</head>
<body>
  <header>
    <h1>FARMSMART</h1>
   
  </header>

  <main>
    <section class="info-section" id="know-weather">
        <h2 class="glassy-heading">KNOW WEATHER</h2>


        <div id="location-input">
            <input type="text" id="location" placeholder="Enter city or location...">
            <button onclick="getWeatherByCity()">Get Weather</button>
          </div>
          
      <div class="weather-container">
        <div class="weather-box" id="weather-box">
          <h3>Current Weather</h3>
          <p>Temperature: <span id="temp">--</span>°C</p>
          <p>Humidity: <span id="humidity">--</span>%</p>
          <p>Condition: <span id="condition">--</span></p>
          <p>Wind Speed: <span id="wind">--</span> m/s</p>
          <p>Pressure: <span id="pressure">--</span> hPa</p>
          <p>Visibility: <span id="visibility">--</span> m</p>
        </div>
      
        <div class="weather-box" id="crop-box">
          <h3>Crop Recommendation</h3>
          <p>Based on current weather, recommended crops are:</p>
          <ul id="crop-list">
            <li>--</li>
          </ul>
        </div>
      </div>
      

        
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 FarmSmart. All rights reserved.</p>
  </footer>

  <script src="SCRPT1.js"></script>
  
</body>
</html>
