<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - FarmSmart</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="register-container">
    <h2 class="animate-down">JOIN FARM SMART</h2>
    <p class="subtext">Register to access your personalized farming dashboard</p>

    <!-- Registration Form -->
    <form action="#" method="POST" class="register-form" onsubmit="registerAndRedirect(event)">
      <div class="custom-cursor"></div>
      
      <!-- Input Fields -->
      <input type="text" class="fancy-input" placeholder="🌱 Full Name" required />
      <input type="email" class="fancy-input" placeholder="📧 Email Address" required />
      <input type="password" class="fancy-input" placeholder="🔒 Password" required />
      <input type="password" class="fancy-input" placeholder="🔐 Confirm Password" required />
      
      <button type="submit">Register</button>

      <!-- Login Link -->
      <p class="login-link">Already have an account? <a href="login.html">Login here</a></p>
    </form>
  </div>

  <script>
    // Handle form submission
    function registerAndRedirect(event) {
      event.preventDefault();  // Prevent default form submission

      // You can add form validation here if needed
      
      // Redirect to home.html with a success message in the URL
      window.location.href = "home.html?registration=success";  // Redirect with query string
    }
  </script>
</body>
</html>
